<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VortexTech | Criar Conta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container-centralizado">
        <main class="perfil-card">
            <header class="perfil-header">
                <div class="avatar-grande"><i class="fas fa-user-plus"></i></div>
                <h1>Criar Conta</h1>
                <p>Junte-se à Plataforma para Jovens</p>
            </header>

           <section class="perfil-form">
    <form action="/cadastrar" method="POST">
        
        <div class="input-group">
            <label><i class="fas fa-user"></i> Nome Completo</label>

            <input
                type="text"
                id="cadNome"
                name="nome"
                placeholder="Ex: Maria Jose Santos"
                required>
        </div>

        <div class="input-group">
            <label><i class="fas fa-envelope"></i> E-mail</label>

            <input
                type="email"
                id="cadEmail"
                name="email"
                placeholder="seu@email.com"
                required>
        </div>

        <div class="input-group">
            <label><i class="fas fa-phone"></i> Telefone</label>

            <input
                type="tel"
                id="cadTel"
                placeholder="(11) 99999-9999">
        </div>

        <div class="input-group">
            <label><i class="fas fa-lock"></i> Criar Senha</label>

            <input
                type="password"
                id="cadSenha"
                name="senha"
                placeholder="No mínimo 6 caracteres"
                required>
        </div>

        <div class="acoes-perfil">

            <button type="submit" class="btn-main">
                Cadastrar Agora
            </button>

            <a href="/" class="btn-voltar"
            style="margin-top: 10px; display: block;">
                Já tenho conta? Entrar
            </a>

        </div>

    </form>
</section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
